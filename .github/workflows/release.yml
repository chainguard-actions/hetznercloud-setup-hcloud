name: Release

on:
  release:
    types: [released]

jobs:
  update_major_tag:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          token: ${{ secrets.HCLOUD_BOT_TOKEN }}
          fetch-depth: 0

      - name: Extract major from version
        id: major
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          safe=$(printf '%s' "$TAG_NAME" | tr -d '\n\r')
          major=$(awk -F '.' '{print $1}' <<< "$safe")
          printf 'major=%s\n' "$major" >> "$GITHUB_OUTPUT"

      - name: Update major tag
        env:
          MAJOR: ${{ steps.major.outputs.major }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: git tag --force "$MAJOR" "$TAG_NAME"

      - name: Push updated major tag
        env:
          MAJOR: ${{ steps.major.outputs.major }}
        run: git push --force origin "$MAJOR"
