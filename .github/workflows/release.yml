name: Release

on:
  release:
    types: [released]

jobs:
  update_major_tag:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ secrets.HCLOUD_BOT_TOKEN }}
          fetch-depth: 0

      - name: Extract major from version
        id: major
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          safe_tag=$(printf '%s' "$TAG_NAME" | tr -d '\n\r')
          major=$(printf '%s' "$safe_tag" | awk -F '.' '{print $1}')
          safe_major=$(printf '%s' "$major" | tr -d '\n\r')
          printf 'major=%s\n' "$safe_major" >> "$GITHUB_OUTPUT"

      - name: Update major tag
        env:
          MAJOR: ${{ steps.major.outputs.major }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: git tag --force "$MAJOR" "$TAG_NAME"

      - name: Push updated major tag
        env:
          MAJOR: ${{ steps.major.outputs.major }}
        run: git push --force origin "$MAJOR"
