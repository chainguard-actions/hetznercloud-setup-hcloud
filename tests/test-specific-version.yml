name: Test specific version installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          hcloud-version: v1.43.1

      - name: Assert hcloud-version output matches requested version
        env:
          HCLOUD_VERSION: ${{ steps.action.outputs.hcloud-version }}
        run: |
          echo "hcloud-version output: $HCLOUD_VERSION"
          if [ -z "$HCLOUD_VERSION" ]; then
            echo "FAIL: hcloud-version output is empty"
            exit 1
          fi
          # The output version should contain 1.43.1
          if echo "$HCLOUD_VERSION" | grep -qF "1.43.1"; then
            echo "PASS: hcloud-version output contains '1.43.1'"
          else
            echo "FAIL: expected version containing '1.43.1', got '$HCLOUD_VERSION'"
            exit 1
          fi

      - name: Assert hcloud binary is on PATH
        run: |
          if ! command -v hcloud >/dev/null 2>&1; then
            echo "FAIL: hcloud binary not found on PATH"
            exit 1
          fi
          echo "PASS: hcloud binary found at $(command -v hcloud)"

      - name: Assert hcloud binary reports correct version
        run: |
          VERSION_OUTPUT=$(hcloud version 2>&1)
          echo "hcloud version output: $VERSION_OUTPUT"
          if echo "$VERSION_OUTPUT" | grep -qF "1.43.1"; then
            echo "PASS: hcloud reports version 1.43.1"
          else
            echo "FAIL: expected version 1.43.1 in output, got: $VERSION_OUTPUT"
            exit 1
          fi
