name: Test specific version installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          hcloud-version: v1.43.1

      - name: Assert hcloud-version output matches requested version
        env:
          ACTUAL: ${{ steps.action.outputs.hcloud-version }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: hcloud-version output is empty"
            exit 1
          fi
          # The output should contain the version we requested (with or without leading 'v')
          EXPECTED="1.43.1"
          if echo "$ACTUAL" | grep -qF "$EXPECTED"; then
            echo "PASS: hcloud-version output '$ACTUAL' contains expected version '$EXPECTED'"
          else
            echo "FAIL: hcloud-version output '$ACTUAL' does not contain expected version '$EXPECTED'"
            exit 1
          fi

      - name: Assert hcloud is on PATH
        run: |
          if ! command -v hcloud >/dev/null 2>&1; then
            echo "FAIL: hcloud not found on PATH"
            exit 1
          fi
          echo "PASS: hcloud found at $(command -v hcloud)"

      - name: Assert hcloud version matches expected
        run: |
          VERSION_OUTPUT=$(hcloud version 2>&1)
          echo "hcloud version output: $VERSION_OUTPUT"
          EXPECTED="1.43.1"
          if echo "$VERSION_OUTPUT" | grep -qF "$EXPECTED"; then
            echo "PASS: hcloud version output contains expected version '$EXPECTED'"
          else
            echo "FAIL: hcloud version output '$VERSION_OUTPUT' does not contain expected version '$EXPECTED'"
            exit 1
          fi
